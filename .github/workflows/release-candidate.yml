name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Go binaries and npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: 运行发布前测试
        run: |
          go mod verify
          go test ./...
          go vet ./...
          go test ./internal/app -run 'Test(SkillContractMatchesCommandSchema|ImplementedFlagsMatchCommandSchema|DocumentationCommandOptionsMatchSchema|ExternalCommandErrorsHaveRecoveryDocumentation|PackageVersionMatchesRuntimeVersion|DocumentationRelativeLinksResolve|OfficialArticleDNSFallbackDocumentationMatchesImplementation|NativeOCRSandboxBoundaryIsDocumented|MacOSAcceptanceBoundaryMatchesCapabilities|DocumentedEnvironmentVariablesMatchImplementation)$'
      - name: 运行 npm 与 Skill 打包测试
        working-directory: npm
        run: node --test tests/*.test.js
      - name: 构建各平台二进制
        run: |
          mkdir -p dist
          candidate_ldflags="-s -w -X github.com/zanescope/v-local-cli/internal/provider.buildMode=candidate"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "${candidate_ldflags}" -o dist/v-local-cli-windows-amd64.exe ./cmd/v-local-cli
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "${candidate_ldflags}" -o dist/v-local-cli-windows-arm64.exe ./cmd/v-local-cli
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "${candidate_ldflags}" -o dist/v-local-cli-darwin-amd64 ./cmd/v-local-cli
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "${candidate_ldflags}" -o dist/v-local-cli-darwin-arm64 ./cmd/v-local-cli
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "${candidate_ldflags}" -o dist/v-local-cli-linux-amd64 ./cmd/v-local-cli
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "${candidate_ldflags}" -o dist/v-local-cli-linux-arm64 ./cmd/v-local-cli
      - name: 生成并复制校验和
        run: |
          cd dist
          sha256sum v-local-cli-* > checksums.txt
          cd ..
          cp dist/checksums.txt npm/checksums.txt
          go list -m -json all > dist/go-modules.jsonl
          for binary in dist/v-local-cli-*; do go version -m "$binary"; done > dist/build-info.txt
      - name: 验证发布版本与资产契约
        working-directory: npm
        run: npm run verify-release
      - name: 打包 npm 安装入口
        working-directory: npm
        run: npm pack
      - name: 为候选发布件生成 GitHub 来源证明
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*
            npm/*.tgz
      - name: 保存候选发布件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v-local-cli-release-candidate
          path: |
            dist/*
            npm/*.tgz
          if-no-files-found: error
          retention-days: 14
