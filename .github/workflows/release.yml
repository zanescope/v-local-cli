name: Signed release

on:
  push:
    tags:
      - 'v*'
      - '!v*-dev.*'

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: 验证标签与版本
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./npm/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"
          if [[ "${version}" == *-* ]]; then
            echo "npm-tag=next" >> "${GITHUB_OUTPUT}"
          else
            echo "npm-tag=latest" >> "${GITHUB_OUTPUT}"
          fi

  # 测试与静态检查由 Audit gates 统一提供，签名作业以它为前置条件。此前打标签时只在
  # ubuntu 跑一遍 go test/vet，Authenticode、WER、reparse point 和 darwin 信任等平台
  # 专属代码从未在发布路径上验证过；Audit gates 虽然也会在 push 时触发，但那是与发布
  # 并行运行，失败并不能阻止发布。
  audit:
    name: Audit gates
    needs: validate
    uses: ./.github/workflows/audit-gates.yml

  windows:
    name: Sign Windows ${{ matrix.arch }}
    needs: [validate, audit]
    runs-on: windows-latest
    timeout-minutes: 25
    environment: release
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 导入 Authenticode 证书
        id: certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) { throw '缺少 Windows 签名证书' }
          $path = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows 签名证书导入失败' }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: 构建、签名并验证 Windows 发布件
        shell: pwsh
        run: |
          ./scripts/build-windows-release.ps1 -Arch '${{ matrix.arch }}' -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'build/windows-${{ matrix.arch }}/v-local-cli.exe' 'dist/v-local-cli-windows-${{ matrix.arch }}.exe'
          Copy-Item 'build/windows-${{ matrix.arch }}/signature-manifest.json' 'dist/signature-manifest-windows-${{ matrix.arch }}.json'
          if ('${{ matrix.arch }}' -eq 'amd64') {
            & 'dist/v-local-cli-windows-amd64.exe' --version
            if ($LASTEXITCODE -ne 0) { throw '签名 Windows 二进制 version 烟测失败' }
            & 'dist/v-local-cli-windows-amd64.exe' schema sessions | Out-Null
            if ($LASTEXITCODE -ne 0) { throw '签名 Windows 二进制 schema 烟测失败' }
            & 'dist/v-local-cli-windows-amd64.exe' --output yaml schema sessions | Out-Null
            if ($LASTEXITCODE -ne 0) { throw '签名 Windows 二进制 YAML 烟测失败' }
          }
      - name: 移除临时证书与 PFX 私钥文件
        # 无条件运行：导入失败时 PFX 已经落盘而 thumbprint 为空，按 thumbprint 设条件
        # 会正好跳过最需要清理的那种情况。托管 runner 随作业销毁，自托管则会把签名
        # 私钥留在磁盘上。
        if: always()
        shell: pwsh
        run: |
          $thumbprint = '${{ steps.certificate.outputs.thumbprint }}'
          if ($thumbprint -and (Test-Path -LiteralPath "Cert:\CurrentUser\My\$thumbprint")) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          if (Test-Path -LiteralPath $pfx) {
            Remove-Item -LiteralPath $pfx -Force
          }
      - name: 保存签名资产
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Sign and notarize ${{ matrix.name }}
    needs: [validate, audit]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-amd64
            runner: macos-15-intel
            arch: amd64
          - name: darwin-arm64
            runner: macos-latest
            arch: arm64
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 导入 Developer ID 证书
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          test -n "${CERTIFICATE_BASE64}"
          test -n "${CODESIGN_IDENTITY}"
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${CERTIFICATE_BASE64}" | openssl base64 -d -A -out "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain_path}"
          # 追加而不是替换搜索列表：-s 会用给定值覆盖整个列表，删除临时钥匙串后就只剩
          # 一个空列表，自托管 runner 上的后续签名会失败。
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | tr -d '"')
          echo "V_LOCAL_CLI_CODESIGN_IDENTITY=${CODESIGN_IDENTITY}" >> "${GITHUB_ENV}"
      - name: 构建并签名 macOS 发布件
        shell: bash
        env:
          V_LOCAL_CLI_RELEASE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          bash scripts/build-macos-release.sh '${{ matrix.arch }}'
          mkdir -p dist
          cp 'build/darwin-${{ matrix.arch }}/v-local-cli' 'dist/v-local-cli-darwin-${{ matrix.arch }}'
          stage="${RUNNER_TEMP}/cli-dmg-${{ matrix.arch }}"
          mkdir -p "${stage}"
          cp 'build/darwin-${{ matrix.arch }}/v-local-cli' "${stage}/v-local-cli"
          dmg="dist/v-local-cli-${{ matrix.name }}.dmg"
          hdiutil create -volname 'v-local-cli' -srcfolder "${stage}" -ov -format UDZO "${dmg}"
          codesign --force --timestamp --sign "${V_LOCAL_CLI_CODESIGN_IDENTITY}" "${dmg}"
      - name: 提交 Apple notarization 并验收
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          test -n "${APPLE_ID}"
          dmg='dist/v-local-cli-${{ matrix.name }}.dmg'
          submission="$(xcrun notarytool submit "${dmg}" --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}" --wait --output-format json)"
          submission_id="$(printf '%s' "${submission}" | plutil -extract id raw -o - -)"
          submission_status="$(printf '%s' "${submission}" | plutil -extract status raw -o - -)"
          test -n "${submission_id}"
          test "${submission_status}" = 'Accepted'
          notary_log="${RUNNER_TEMP}/notary-${{ matrix.name }}.json"
          xcrun notarytool log "${submission_id}" --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}" "${notary_log}"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); bad=[i for i in d.get("issues", []) if str(i.get("severity", "")).lower() in {"warning", "error"}]; print(json.dumps(bad, ensure_ascii=False, indent=2)) if bad else None; sys.exit(1 if bad else 0)' "${notary_log}"
          xcrun stapler staple -v "${dmg}"
          xcrun stapler validate -v "${dmg}"
          codesign --verify --strict --verbose=2 "${dmg}"
          codesign --verify --strict --verbose=2 'dist/v-local-cli-darwin-${{ matrix.arch }}'
          spctl --assess --type execute --verbose=4 'dist/v-local-cli-darwin-${{ matrix.arch }}'
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg}"
          'dist/v-local-cli-darwin-${{ matrix.arch }}' --version
          'dist/v-local-cli-darwin-${{ matrix.arch }}' schema sessions >/dev/null
          'dist/v-local-cli-darwin-${{ matrix.arch }}' --output yaml schema sessions >/dev/null
          file 'dist/v-local-cli-darwin-${{ matrix.arch }}'
          cp "${notary_log}" 'dist/notary-log-${{ matrix.name }}.json'
          cli='dist/v-local-cli-darwin-${{ matrix.arch }}'
          team_id="$(codesign --display --verbose=4 "${cli}" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          identifier="$(codesign --display --verbose=4 "${cli}" 2>&1 | awk -F= '/^Identifier=/{print $2; exit}')"
          test -n "${team_id}"
          test "${team_id}" = "${APPLE_TEAM_ID}"
          test "${identifier}" = 'com.zanescope.v-local-cli'
          requirement_text="$(codesign --display --requirements - "${cli}" 2>&1 | sed -n 's/^designated => //p')"
          test -n "${requirement_text}"
          printf '%s' "${requirement_text}" | grep -F 'anchor apple generic' >/dev/null
          printf '%s' "${requirement_text}" | grep -F 'identifier "com.zanescope.v-local-cli"' >/dev/null
          requirement="$(printf '%s' "${requirement_text}" | shasum -a 256 | awk '{print $1}')"
          manifest='dist/signature-manifest-${{ matrix.name }}.json'
          plutil -create json "${manifest}"
          plutil -insert schema_version -integer 1 "${manifest}"
          plutil -insert platform -string darwin "${manifest}"
          plutil -insert arch -string '${{ matrix.arch }}' "${manifest}"
          plutil -insert build_mode -string release "${manifest}"
          plutil -insert team_id -string "${team_id}" "${manifest}"
          plutil -insert code_identifier -string "${identifier}" "${manifest}"
          plutil -insert runtime_signature_required -bool true "${manifest}"
          plutil -insert fixed_install_required -bool true "${manifest}"
          plutil -insert cli_sha256 -string "$(shasum -a 256 "${cli}" | awk '{print $1}')" "${manifest}"
          plutil -insert cli_designated_requirement_sha256 -string "${requirement}" "${manifest}"
          plutil -insert notarization_submission_id -string "${submission_id}" "${manifest}"
          plutil -insert notarization_status -string "${submission_status}" "${manifest}"
          plutil -insert stapled -bool true "${manifest}"
          plutil -insert dmg_sha256 -string "$(shasum -a 256 "${dmg}" | awk '{print $1}')" "${manifest}"
      - name: 移除临时签名钥匙串与 p12
        # 与 Windows 侧同理：Developer ID 私钥不能在作业结束后留在磁盘上。
        # delete-keychain 同时把它从搜索列表中移除，前一步追加式设置保证原有条目仍在。
        if: always()
        shell: bash
        run: |
          keychain_path="${RUNNER_TEMP}/release-signing.keychain-db"
          if [ -f "${keychain_path}" ]; then
            security delete-keychain "${keychain_path}" || true
          fi
          rm -f "${RUNNER_TEMP}/developer-id.p12"
      - name: 保存签名资产
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build Linux ${{ matrix.arch }}
    needs: [validate, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 构建 Linux 发布件
        shell: bash
        run: |
          mkdir -p dist
          GOOS=linux GOARCH='${{ matrix.arch }}' CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -X github.com/zanescope/v-local-cli/internal/provider.buildMode=release' -o 'dist/v-local-cli-linux-${{ matrix.arch }}' ./cmd/v-local-cli
      - name: 保存 Linux 资产
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release and npm package
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: 配置 npm staged publishing 客户端
        run: npm install --global npm@11.19.0
      - name: 收集发布资产
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-cli-*
          merge-multiple: true
          path: dist
      - name: 生成并验证发布清单
        shell: bash
        run: |
          expected=(
            v-local-cli-windows-amd64.exe
            v-local-cli-windows-arm64.exe
            v-local-cli-darwin-amd64
            v-local-cli-darwin-arm64
            v-local-cli-linux-amd64
            v-local-cli-linux-arm64
          )
          : > dist/checksums.txt
          for file in "${expected[@]}"; do
            test -f "dist/${file}"
            (cd dist && sha256sum "${file}") >> dist/checksums.txt
          done
          for arch in amd64 arm64; do
            test -f "dist/v-local-cli-darwin-${arch}.dmg"
            test -f "dist/signature-manifest-windows-${arch}.json"
            test -f "dist/signature-manifest-darwin-${arch}.json"
            test -f "dist/notary-log-darwin-${arch}.json"
          done
          cp dist/checksums.txt npm/checksums.txt
          go list -m -json all > dist/go-modules.jsonl
          for binary in "${expected[@]}"; do go version -m "dist/${binary}"; done > dist/build-info.txt
          npm --prefix npm test
          npm --prefix npm run verify-release
          (cd npm && npm pack)
          {
            find dist -maxdepth 1 -type f ! -name release-checksums.txt -printf '%f\n' | while IFS= read -r file; do
              (cd dist && sha256sum "${file}")
            done
            for package in npm/*.tgz; do
              sha256sum "${package}" | sed 's#  npm/#  #'
            done
          } | LC_ALL=C sort -k2 > dist/release-checksums.txt
      - name: 为正式发布件生成 GitHub 来源证明
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*
            npm/*.tgz
      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_prerelease="$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq '.isPrerelease')"
            test "${is_prerelease}" = "true" || { echo '已存在的正式 Release 不能由未复验工作流覆盖' >&2; exit 1; }
            gh release upload "${GITHUB_REF_NAME}" dist/* npm/*.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* npm/*.tgz --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" --prerelease
          fi
      - name: 检查 npm 首次发布状态
        id: npm-registry
        shell: bash
        run: |
          if npm view '@zanescope/v-local-cli' name --json >/dev/null 2>&1; then
            echo 'exists=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'exists=false' >> "${GITHUB_OUTPUT}"
            echo '::notice::npm 包尚不存在；请下载本次 Release 的 tgz，用交互式 2FA 完成首次发布，再配置 Trusted Publisher。'
          fi
      - name: 通过 npm Trusted Publishing 提交 staged publish
        if: steps.npm-registry.outputs.exists == 'true'
        shell: bash
        run: npm stage publish npm/*.tgz --access public --provenance --tag '${{ needs.validate.outputs.npm-tag }}'
